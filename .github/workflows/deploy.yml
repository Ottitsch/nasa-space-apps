name: deploy

# Checks the site on every pull request to main, and publishes the web folder
# to GitHub Pages on every push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site is the web folder as it is. Fetching only that folder skips
      # the 1.2 GB of radar windows in data/nisar.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web

      - name: check that the scripts parse
        run: |
          for f in web/js/*.js; do
            echo "$f"
            node --input-type=module --check < "$f"
          done

      - name: check that every place has its data
        run: |
          ids=$(jq -er '.places[].id' web/data/index.json)
          for id in $ids; do
            gzip -t "web/data/$id/core.bin.gz" "web/data/$id/frames.bin.gz"
          done
          echo "$(echo "$ids" | wc -l) places"

      - name: upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a running deploy finish, then publish the newest commit.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
